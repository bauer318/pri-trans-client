version: '3.9'

services:
  pri-trans-ui:
    container_name: pri_trans_ui
    build:
      context: ./
      dockerfile: docker/Dockerfile
      args:
        NODE_ENV: production
    tty: true
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "80:80"
      - "443:443"
    networks:
      - pri-trans-ui_bridge

networks:
  pri-trans-ui_bridge:
    driver: bridge
